name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - run: npm ci
      - run: npm test
      - run: npm run test:shell
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm pack
      - run: node scripts/smoke-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: clx-${{ matrix.os }}-node${{ matrix.node }}
          path: clx-constellation-*.tgz
